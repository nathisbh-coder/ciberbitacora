---
layout: default
---
<section class="hero" style="background-image:url('{{ '/assets/img/hero.png' | relative_url }}')">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>
<section class="grid">
  {% for post in site.posts %}
  <article class="card">
    <a href="{{ post.url | relative_url }}"><img src="{{ post.image | relative_url }}" alt="{{ post.image_alt }}"></a>
    <div class="card-body">
      <p class="meta">{{ post.date | date: '%d/%m/%Y' }} · <span class="tag">{{ post.category }}</span></p>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p>{{ post.excerpt | strip_html | truncate: 140 }}</p>
      <a class="btn" href="{{ post.url | relative_url }}">Leer más</a>
    </div>
  </article>
  {% endfor %}
</section>
